<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  :root {
    --surround: #e9e6e0;
    --paper: #ffffff;
    --ink: #17171a;
    --rule: #d8d4cc;
    --muted: #6d6a64;
    --brass: #8a6416;
  }
  html.dark { --surround: #101114; --rule: #cfcbc2; }
  html, body { margin: 0; padding: 0; background: var(--surround); }
  body {
    font-family: 'KaTeX_Main', 'Latin Modern Roman', Georgia, serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    display: flex;
    justify-content: center;
    overflow: hidden;
  }
  .page {
    width: 6.9in;
    flex: none;
    position: relative;
    transform-origin: top center;
    margin: 20px auto 40px;
    padding: 0.85in 0.8in 1in;
    background: var(--paper);
    box-shadow: 0 1px 2px rgba(0,0,0,.16), 0 10px 30px rgba(0,0,0,.10);
    border-radius: 2px;
    box-sizing: border-box;
  }
  /* Where the PDF export will cut the page. Purely visual: exported and printed
     output never contains these, and they never affect layout. */
  .page-break {
    position: absolute;
    left: 0;
    right: 0;
    height: 0;
    border-top: 1.5px dashed var(--rule);
    pointer-events: none;
    z-index: 5;
  }
  .page-break .tag {
    position: absolute;
    top: -8px;
    right: 12px;
    background: var(--surround);
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .03em;
    padding: 1px 7px;
    border: 1px solid var(--rule);
    border-radius: 3px;
  }
  #doc { counter-reset: sec eq; font-size: 11.6pt; line-height: 1.52; }
  #doc p { margin: 0 0 .62em; text-align: justify; hyphens: auto; }
  #doc p + p { text-indent: 1.2em; margin-top: -.2em; }
  #doc h1, #doc h2, #doc h3, #doc h4 { font-weight: 700; line-height: 1.25; margin: 1.5em 0 .5em; }
  #doc h1:not(.doctitle) { font-size: 1.32em; counter-increment: sec; counter-reset: sub; }
  #doc h1:not(.doctitle)::before { content: counter(sec) "\2003"; }
  #doc h2 { font-size: 1.14em; counter-increment: sub; counter-reset: subsub; }
  #doc h2::before { content: counter(sec) "." counter(sub) "\2003"; }
  #doc h3 { font-size: 1.02em; counter-increment: subsub; }
  #doc h3::before { content: counter(sec) "." counter(sub) "." counter(subsub) "\2003"; }
  #doc h4 { font-size: 1em; display: inline; margin-right: .6em; }
  .docmeta { text-align: center; margin: .4in 0 .5in; }
  .doctitle { font-size: 1.9em; font-weight: 700; margin: 0 0 .5em; letter-spacing: -.01em; }
  .docauthor { font-size: 1.05em; }
  .docdate { font-size: .95em; color: var(--muted); margin-top: .35em; }
  .abstract { margin: 0 .5in .5in; font-size: .95em; }
  .abstitle { text-align: center; font-weight: 700; margin-bottom: .4em; }
  #doc ul, #doc ol { margin: .4em 0 .7em; padding-left: 1.6em; }
  #doc ol.lettered { list-style: none; padding-left: 2.1em; }
  #doc ol.lettered > li { text-indent: -1.5em; }
  #doc ol.lettered .lbl { margin-right: .45em; }
  #doc li { margin: .18em 0; }
  #doc blockquote { margin: .7em 1.4em; color: var(--muted); font-style: italic; }
  #doc hr { border: 0; border-top: 1px solid var(--rule); margin: 1.2em 0; }
  #doc code { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: .88em; background: rgba(0,0,0,.045); padding: .08em .28em; border-radius: 3px; }
  #doc pre { background: rgba(0,0,0,.04); padding: .7em .9em; border-radius: 4px; overflow-x: auto; }
  #doc pre code { background: none; padding: 0; font-size: .85em; }
  .boxed {
    border: 1px solid var(--rule);
    border-left: 3px solid var(--brass);
    padding: .65em .85em;
    margin: .95em 0;
    border-radius: 2px;
  }
  .env { margin: .8em 0; }
  .envname { font-weight: 700; font-style: normal; }
  .env.theorem, .env.lemma, .env.corollary, .env.proposition, .env.claim { font-style: italic; }
  .env.proof .envname { font-style: italic; font-weight: 400; }
  .tablewrap { overflow-x: auto; margin: .9em 0; }
  #doc table { border-collapse: collapse; margin: 0 auto; font-size: .96em; }
  #doc th, #doc td { padding: .3em .7em; text-align: left; }
  #doc thead, #doc tr:first-child th { border-bottom: 1px solid var(--ink); }
  #doc th { font-weight: 700; }
  #doc table { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .kd { margin: .85em 0; position: relative; }
  .numbered::after {
    counter-increment: eq; content: "(" counter(eq) ")";
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    font-size: .95em;
  }
  .err { color: #b3261e; font-family: 'SF Mono', monospace; font-size: .86em; }
  .katex { font-size: 1.04em; }
  .empty { color: var(--muted); text-align: center; padding: 2in 0; font-size: .95em; }
  .flash { animation: flash .5s ease-out; }
  @keyframes flash { from { background: rgba(138,100,22,.16); } to { background: transparent; } }
  /* export mode: an exact 624px column (6.5in at 96dpi) that the exporter scales to fit */
  html.exporting, html.exporting body { background: #fff; }
  html.exporting .stage { overflow: visible; }
  html.exporting .page {
    width: 624px; max-width: none; margin: 0; padding: 0;
    box-shadow: none; border-radius: 0;
    transform: none !important;
  }
  @media print {
    html, body { background: #fff; }
    .page { width: auto; max-width: none; margin: 0; padding: 0; box-shadow: none; border-radius: 0; }
    #doc h1, #doc h2, #doc h3 { break-after: avoid; }
    .kd, table, pre { break-inside: avoid; }
    .page-break { display: none; }
  }
</style>
</head>
<body>
  <div class="stage"><div class="page"><div id="doc"><div class="empty">Start typing - the rendered document appears here.</div></div></div></div>
  <script src="katex/katex.min.js"></script>
  <script>
  (function () {
    var cache = new Map();
    var doc = document.getElementById('doc');

    function renderMath(scope) {
      var nodes = scope.querySelectorAll('.km');
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        var tex = el.textContent;
        var display = el.classList.contains('kd');
        var key = (display ? 'D' : 'I') + tex;
        var out = cache.get(key);
        if (out === undefined) {
          try {
            out = katex.renderToString(tex, {
              displayMode: display, throwOnError: false, strict: false, trust: false,
              errorColor: '#b3261e', maxSize: 30
            });
          } catch (e) {
            out = '<span class="err">' + tex.replace(/</g, '&lt;') + '</span>';
          }
          if (cache.size > 900) cache.clear();
          cache.set(key, out);
        }
        el.innerHTML = out;
      }
    }

    // Math fonts load lazily by default, which means the first formula - and any
    // export taken right after it - can be laid out with fallback metrics.
    var fontsReady = (function () {
      if (!document.fonts) return Promise.resolve();
      try { document.fonts.forEach(function (f) { f.load(); }); } catch (e) {}
      return document.fonts.ready;
    })();

    var stage = document.querySelector('.stage');
    var page = document.querySelector('.page');
    var exporting = false;

    /* The paper keeps its proportions. A narrow pane zooms out rather than
       reflowing the text into a skinnier column, the way a PDF viewer behaves. */
    function fit() {
      if (exporting) return;
      page.style.transform = '';
      stage.style.height = '';
      var available = stage.clientWidth - 24;
      var natural = page.offsetWidth;
      if (!natural) return;
      var scale = Math.min(1, available / natural);
      if (scale < 0.25) scale = 0.25;
      if (scale >= 0.999) return;
      page.style.transform = 'scale(' + scale + ')';
      stage.style.height = Math.ceil(page.offsetHeight * scale) + 'px';
    }

    if (window.ResizeObserver) {
      var observer = new ResizeObserver(function () { fit(); });
      observer.observe(stage);
    } else {
      window.addEventListener('resize', fit);
    }

    window.bl = {
      ready: function () { return fontsReady; },
      fit: fit,
      set: function (html) {
        var scroller = document.scrollingElement || document.body;
        var top = scroller.scrollTop;
        doc.innerHTML = html || '<div class="empty">Start typing - the rendered document appears here.</div>';
        renderMath(doc);
        fit();
        scroller.scrollTop = top;
        if (!exporting) renderPageBreaks();
      },
      syncTo: function (line) {
        var best = null, bestLine = -1;
        var nodes = doc.querySelectorAll('[data-l]');
        for (var i = 0; i < nodes.length; i++) {
          var l = parseInt(nodes[i].getAttribute('data-l'), 10);
          if (l <= line && l > bestLine) { bestLine = l; best = nodes[i]; }
        }
        if (!best) return;
        var r = best.getBoundingClientRect();
        if (r.top < 40 || r.bottom > window.innerHeight - 40) {
          best.scrollIntoView({ block: 'center' });
        }
      },
      exportOn: function () {
        exporting = true;
        page.style.transform = '';
        stage.style.height = '';
        document.documentElement.classList.add('exporting');
        removeBreakMarkers();
      },
      /* Page-break offsets that never cut through a line, in CSS pixels. */
      metrics: function (pageH) {
        var m = computeBreaks(pageH);
        return JSON.stringify(m);
      },
      showPageBreaks: renderPageBreaks,
      theme: function (dark) {
        document.documentElement.classList.toggle('dark', !!dark);
      }
    };

    /* Elements that are one visual unit and must never be split across a page:
       a display formula, a table, a code block. There is no safe place to cut
       inside one - a formula has no "line", a table row could straddle a page -
       so their own top and bottom edges are the only candidates. */
    var HARD_ATOMIC_SELECTOR = '.km.kd, table, pre';
    /* A boxed passage is kept whole the same way, but only when a whole page can
       actually hold it - it is ordinary paragraph text, so unlike a formula it
       does have safe internal lines, and falls back to those instead of forcing
       an oversized box onto one page or, worse, off the page. */
    var SOFT_ATOMIC_SELECTOR = '.boxed';
    /* Elements whose own wrapped lines are safe cut points. Earlier this only
       used each block's own bottom edge, so a paragraph or boxed passage taller
       than the gap left on a page had nowhere safe to break and got sliced
       through the middle of a line. Every wrapped line is now a candidate. */
    var LEAF_SELECTOR = 'p, li, blockquote, .boxed, .env, h1, h2, h3, h4, .docmeta, .abstract';
    var PAGE_HEIGHT = 864;

    function rectsOf(selector, originY) {
      var out = [];
      var els = doc.querySelectorAll(selector);
      for (var i = 0; i < els.length; i++) {
        var r = els[i].getBoundingClientRect();
        if (r.height > 0) out.push({ top: r.top - originY, bottom: r.bottom - originY });
      }
      return out;
    }

    /// Every y (in page-local px, from the page's own top) it would be safe to
    /// cut at, plus the total height and width of the page content.
    function computeBreaks(pageH) {
      var pageRect = page.getBoundingClientRect();
      var originY = pageRect.top;
      var total = Math.ceil(pageRect.height);
      var width = Math.ceil(pageRect.width);

      var hardAtomics = rectsOf(HARD_ATOMIC_SELECTOR, originY);
      var softAtomics = rectsOf(SOFT_ATOMIC_SELECTOR, originY);

      var soft = [];
      var leafEls = doc.querySelectorAll(LEAF_SELECTOR);
      var range = document.createRange();
      for (var l = 0; l < leafEls.length; l++) {
        var el = leafEls[l];
        range.selectNodeContents(el);
        var rects = range.getClientRects();
        for (var i = 0; i < rects.length; i++) {
          if (rects[i].height > 0) soft.push(Math.round(rects[i].bottom - originY));
        }
        var own = el.getBoundingClientRect();
        if (own.height > 0) soft.push(Math.round(own.bottom - originY));
      }
      hardAtomics.concat(softAtomics).forEach(function (a) {
        soft.push(Math.round(a.top));
        soft.push(Math.round(a.bottom));
      });

      // never land inside a formula, a table or a code block
      soft = soft.filter(function (y) {
        for (var i = 0; i < hardAtomics.length; i++) {
          if (y > hardAtomics[i].top + 1 && y < hardAtomics[i].bottom - 1) return false;
        }
        return true;
      });
      // a boxed passage is kept whole too, but only where that is possible: once
      // it is taller than a full page there is no page it would ever fit on, so
      // it rolls over freely instead, breaking at its own safe line boundaries.
      soft = soft.filter(function (y) {
        for (var i = 0; i < softAtomics.length; i++) {
          var box = softAtomics[i];
          if (box.bottom - box.top > pageH) continue;
          if (y > box.top + 1 && y < box.bottom - 1) return false;
        }
        return true;
      });
      soft = Array.from(new Set(soft)).sort(function (x, y) { return x - y; });

      var breaks = [];
      var start = 0;
      var guard = 0;
      while (start < total - 2 && guard < 2000) {
        guard++;
        var limit = start + pageH;
        if (limit >= total) { breaks.push(total); break; }
        var best = -1;
        for (var i = 0; i < soft.length; i++) {
          if (soft[i] > start && soft[i] <= limit && soft[i] > best) best = soft[i];
        }
        if (best < 0) {
          // Nothing fits in a whole page: one line or block is taller than the
          // page. Take the next real edge rather than guess a pixel row, so the
          // page still runs long instead of cutting through content.
          for (var j = 0; j < soft.length; j++) {
            if (soft[j] > start) { best = soft[j]; break; }
          }
        }
        if (best <= start) { breaks.push(total); break; }
        breaks.push(best);
        start = best;
      }
      if (!breaks.length) breaks.push(total);
      return { total: total, width: width, breaks: breaks };
    }

    function removeBreakMarkers() {
      var old = page.querySelectorAll('.page-break');
      for (var i = 0; i < old.length; i++) old[i].remove();
    }

    /// Draws where the PDF export will cut the page. The transform is cleared
    /// while measuring - getBoundingClientRect() reports the scaled size under
    /// the fit() zoom, which would put every marker at the wrong height - then
    /// restored; the markers are children of .page, so they scale back with it.
    function renderPageBreaks() {
      removeBreakMarkers();
      if (exporting) return;
      var prevTransform = page.style.transform;
      page.style.transform = '';
      var m = computeBreaks(PAGE_HEIGHT);
      page.style.transform = prevTransform;
      for (var i = 0; i < m.breaks.length - 1; i++) {
        var y = m.breaks[i];
        if (y >= m.total - 1) continue;
        var marker = document.createElement('div');
        marker.className = 'page-break';
        marker.style.top = y + 'px';
        var tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = 'Page ' + (i + 2);
        marker.appendChild(tag);
        page.appendChild(marker);
      }
    }

    fontsReady.then(function () { if (!exporting) renderPageBreaks(); });
  })();
  </script>
</body>
</html>
