<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  :root {
    --surround: #e9e6e0;
    --paper: #ffffff;
    --ink: #17171a;
    --rule: #d8d4cc;
    --muted: #6d6a64;
    --brass: #8a6416;
  }
  html.dark { --surround: #101114; --rule: #cfcbc2; }
  /* fit() resizes .stage (and, while settling, .page's cross-axis box) more
     than once per render. WebKit's scroll anchoring tries to keep whatever's
     in view from jumping across a resize by nudging scrollTop on its own,
     stacking up across those calls - it fought the page's own deliberate
     scrollTop restore in set() and could leave a document scrolled well past
     its top on first load. That restore already handles this; the browser's
     own heuristic on top of it is exactly what should not also be moving it. */
  html, body { margin: 0; padding: 0; background: var(--surround); overflow-anchor: none; }
  body {
    font-family: 'KaTeX_Main', 'Latin Modern Roman', Georgia, serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    display: flex;
    justify-content: center;
    /* Flex's default align-items:stretch pins .page's own height to whatever
       .stage's height currently is - but fit() (below) sets .stage's height
       FROM .page's offsetHeight, every time it runs. That circular dependency
       let a single fit() call's own writes change what page.offsetHeight
       reported before the call was even over, so the height it multiplied by
       scale and the height a moment later disagreed - and the container ended
       up sized for a stale, wrong height it never fully let go of. .page's
       height only needs to come from its own content, never from .stage. */
    align-items: flex-start;
    overflow: hidden;
  }
  .page {
    width: 6.9in;
    flex: none;
    position: relative;
    transform-origin: top center;
    margin: 20px auto 40px;
    padding: 0.85in 0.8in 1in;
    background: var(--paper);
    box-shadow: 0 1px 2px rgba(0,0,0,.16), 0 10px 30px rgba(0,0,0,.10);
    border-radius: 2px;
    box-sizing: border-box;
    /* fit() (below) scales this element down with a CSS transform when the
       pane is narrower than the page. WebKit promotes a transformed element to
       its own composited layer the first time a transform is actually set on
       it - and doing that lazily, mid-resize, can leave that layer's backing
       store painted before the white background is, showing the surrounding
       dark page through .page with only the (correctly dark) text drawn on
       top - which looks exactly like faint, ghosted text. Declaring the layer
       up front with will-change means it's already fully painted, background
       included, before any transform is ever applied to it. */
    will-change: transform;
  }
  /* Where the PDF export will cut the page. Purely visual: exported and printed
     output never contains these, and they never affect layout. */
  .page-break {
    position: absolute;
    left: 0;
    right: 0;
    height: 0;
    border-top: 1.5px dashed var(--rule);
    pointer-events: none;
    z-index: 5;
  }
  .page-break .tag {
    position: absolute;
    top: -8px;
    right: 12px;
    background: var(--surround);
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .03em;
    padding: 1px 7px;
    border: 1px solid var(--rule);
    border-radius: 3px;
  }
  #doc { counter-reset: sec eq; font-size: 11.6pt; line-height: 1.52; }
  #doc p { margin: 0 0 .62em; text-align: justify; hyphens: auto; }
  #doc p + p { text-indent: 1.2em; margin-top: -.2em; }
  #doc h1, #doc h2, #doc h3, #doc h4 { font-weight: 700; line-height: 1.25; margin: 1.5em 0 .5em; }
  #doc h1:not(.doctitle) { font-size: 1.32em; counter-increment: sec; counter-reset: sub; }
  #doc h1:not(.doctitle)::before { content: counter(sec) "\2003"; }
  #doc h2 { font-size: 1.14em; counter-increment: sub; counter-reset: subsub; }
  #doc h2::before { content: counter(sec) "." counter(sub) "\2003"; }
  #doc h3 { font-size: 1.02em; counter-increment: subsub; }
  #doc h3::before { content: counter(sec) "." counter(sub) "." counter(subsub) "\2003"; }
  #doc h4 { font-size: 1em; display: inline; margin-right: .6em; }
  .docmeta { text-align: center; margin: .4in 0 .5in; }
  .doctitle { font-size: 1.9em; font-weight: 700; margin: 0 0 .5em; letter-spacing: -.01em; }
  .docauthor { font-size: 1.05em; }
  .docdate { font-size: .95em; color: var(--muted); margin-top: .35em; }
  .abstract { margin: 0 .5in .5in; font-size: .95em; }
  .abstitle { text-align: center; font-weight: 700; margin-bottom: .4em; }
  #doc ul, #doc ol { margin: .4em 0 .7em; padding-left: 1.6em; }
  #doc ol.lettered { list-style: none; padding-left: 2.1em; }
  #doc ol.lettered > li { text-indent: -1.5em; }
  #doc ol.lettered .lbl { margin-right: .45em; }
  #doc li { margin: .18em 0; }
  #doc blockquote { margin: .7em 1.4em; color: var(--muted); font-style: italic; }
  #doc hr { border: 0; border-top: 1px solid var(--rule); margin: 1.2em 0; }
  /* A typed page break takes no space of its own; the dashed line that marks a
     real page boundary is drawn by the same code that draws every other one. */
  .page-break-here { height: 0; margin: 0; padding: 0; }
  #doc code { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: .88em; background: rgba(0,0,0,.045); padding: .08em .28em; border-radius: 3px; }
  #doc pre { background: rgba(0,0,0,.04); padding: .7em .9em; border-radius: 4px; overflow-x: auto; }
  #doc pre code { background: none; padding: 0; font-size: .85em; }
  .boxed {
    border: 1px solid var(--rule);
    border-left: 3px solid var(--brass);
    padding: .65em .85em;
    margin: .95em 0;
    border-radius: 2px;
  }
  .env { margin: .8em 0; }
  .envname { font-weight: 700; font-style: normal; }
  .env.theorem, .env.lemma, .env.corollary, .env.proposition, .env.claim { font-style: italic; }
  .env.proof .envname { font-style: italic; font-weight: 400; }
  .tablewrap { overflow-x: auto; margin: .9em 0; }
  #doc table { border-collapse: collapse; margin: 0 auto; font-size: .96em; }
  #doc th, #doc td { padding: .3em .7em; text-align: left; }
  #doc thead, #doc tr:first-child th { border-bottom: 1px solid var(--ink); }
  #doc th { font-weight: 700; }
  #doc table { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .kd { margin: .85em 0; position: relative; }
  .numbered::after {
    counter-increment: eq; content: "(" counter(eq) ")";
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    font-size: .95em;
  }
  .err { color: #b3261e; font-family: 'SF Mono', monospace; font-size: .86em; }
  .katex { font-size: 1.04em; }
  .empty { color: var(--muted); text-align: center; padding: 2in 0; font-size: .95em; }
  .flash { animation: flash .5s ease-out; }
  @keyframes flash { from { background: rgba(138,100,22,.16); } to { background: transparent; } }
  /* export mode: an exact 624px column (6.5in at 96dpi) that the exporter scales to fit */
  html.exporting, html.exporting body { background: #fff; }
  html.exporting .stage { overflow: visible; }
  html.exporting .page {
    width: 624px; max-width: none; margin: 0; padding: 0;
    box-shadow: none; border-radius: 0;
    transform: none !important;
  }
  @media print {
    html, body { background: #fff; }
    .page { width: auto; max-width: none; margin: 0; padding: 0; box-shadow: none; border-radius: 0; }
    #doc h1, #doc h2, #doc h3 { break-after: avoid; }
    .kd, table, pre { break-inside: avoid; }
    .page-break { display: none; }
  }
</style>
</head>
<body>
  <div class="stage"><div class="page"><div id="doc"><div class="empty">Start typing - the rendered document appears here.</div></div></div></div>
  <script src="katex/katex.min.js"></script>
  <script>
  (function () {
    var cache = new Map();
    var doc = document.getElementById('doc');

    function renderMath(scope) {
      var nodes = scope.querySelectorAll('.km');
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        var tex = el.textContent;
        var display = el.classList.contains('kd');
        var key = (display ? 'D' : 'I') + tex;
        var out = cache.get(key);
        if (out === undefined) {
          try {
            out = katex.renderToString(tex, {
              displayMode: display, throwOnError: false, strict: false, trust: false,
              errorColor: '#b3261e', maxSize: 30
            });
          } catch (e) {
            out = '<span class="err">' + tex.replace(/</g, '&lt;') + '</span>';
          }
          if (cache.size > 900) cache.clear();
          cache.set(key, out);
        }
        el.innerHTML = out;
      }
    }

    // Math fonts load lazily by default, which means the first formula - and any
    // export taken right after it - can be laid out with fallback metrics.
    var fontsReady = (function () {
      if (!document.fonts) return Promise.resolve();
      try { document.fonts.forEach(function (f) { f.load(); }); } catch (e) {}
      return document.fonts.ready;
    })();

    var stage = document.querySelector('.stage');
    var page = document.querySelector('.page');
    var exporting = false;
    /* The zoom fit() last applied, tracked as a number rather than read back off
       the live transform: computeBreaks() needs to divide it back out to measure
       in real, unscaled page units. */
    var currentScale = 1;

    /* The paper keeps its proportions. A narrow pane zooms out rather than
       reflowing the text into a skinnier column, the way a PDF viewer behaves. */
    function fit() {
      if (exporting) return;
      // offsetWidth/offsetHeight report the page's pre-transform size - a CSS
      // transform is a paint-time effect and never changes them - so there is
      // no need to clear the existing scale before reading them.
      var available = stage.clientWidth - 24;
      var natural = page.offsetWidth;
      if (!natural) return;
      var scale = Math.min(1, available / natural);
      if (scale < 0.25) scale = 0.25;
      if (scale >= 0.999) {
        currentScale = 1;
        page.style.transform = '';
        stage.style.height = '';
        return;
      }
      currentScale = scale;
      page.style.transform = 'scale(' + scale + ')';
      stage.style.height = Math.ceil(page.offsetHeight * scale) + 'px';
    }

    /// Calls fit() (and the page-break markers) only once page.offsetHeight has
    /// stopped changing between two consecutive animation frames.
    ///
    /// There is no single event for "the page's real height is now known": the
    /// KaTeX stylesheet and its web fonts each load independently, each capable
    /// of reflowing the page on their own schedule, and document.readyState can
    /// already say "complete" before either one has actually finished applying.
    /// Calling fit() straight from any one of those signals reads whatever
    /// page.offsetHeight happens to be at that instant, which can be wildly
    /// wrong while a fallback font is still standing in for KaTeX's real one.
    /// Waiting for two frames in a row to agree sidesteps needing to know which
    /// signal, if any, is the right one to trust.
    // A token, not a plain in-progress flag: a flag would make a call arriving
    // while an earlier check is still running a no-op, and this genuinely gets
    // called several times close together (the empty placeholder page settling
    // instantly, then set() replacing it with the real document moments later).
    // Dropping the later call is exactly how a stale, too-early height got
    // locked in. Each call instead supersedes whichever check is running, so
    // whichever one was requested most recently is always the one that finishes.
    var settleToken = 0;
    function settleAndFit() {
      var token = ++settleToken;
      var last = -1;
      var stableFrames = 0;
      (function check() {
        if (token !== settleToken) return;
        var current = page.offsetHeight;
        stableFrames = current === last ? stableFrames + 1 : 0;
        last = current;
        if (stableFrames >= 2) {
          fit();
          if (!exporting) renderPageBreaks();
          return;
        }
        requestAnimationFrame(check);
      })();
    }

    if (window.ResizeObserver) {
      // The pane resizing is one reason to refit; the page's own content height
      // changing under it, with the pane untouched, is another - watching .page
      // itself, not just the pane, is what catches that.
      var stageObserver = new ResizeObserver(settleAndFit);
      stageObserver.observe(stage);
      var pageObserver = new ResizeObserver(settleAndFit);
      pageObserver.observe(page);
    } else {
      window.addEventListener('resize', settleAndFit);
    }

    window.bl = {
      ready: function () { return fontsReady; },
      fit: fit,
      set: function (html) {
        var scroller = document.scrollingElement || document.body;
        var top = scroller.scrollTop;
        doc.innerHTML = html || '<div class="empty">Start typing - the rendered document appears here.</div>';
        renderMath(doc);
        // Immediate, so a normal edit is never one frame behind: the layout is
        // already settled by the time you are typing. settleAndFit() follows up
        // in the background to correct this if it wasn't - matters on the very
        // first render, while fonts or the stylesheet might still be loading.
        fit();
        scroller.scrollTop = top;
        if (!exporting) renderPageBreaks();
        settleAndFit();
      },
      syncTo: function (line) {
        var best = null, bestLine = -1;
        var nodes = doc.querySelectorAll('[data-l]');
        for (var i = 0; i < nodes.length; i++) {
          var l = parseInt(nodes[i].getAttribute('data-l'), 10);
          if (l <= line && l > bestLine) { bestLine = l; best = nodes[i]; }
        }
        if (!best) return;
        var r = best.getBoundingClientRect();
        if (r.top < 40 || r.bottom > window.innerHeight - 40) {
          best.scrollIntoView({ block: 'center' });
        }
      },
      exportOn: function () {
        exporting = true;
        currentScale = 1;
        page.style.transform = '';
        stage.style.height = '';
        document.documentElement.classList.add('exporting');
        removeBreakMarkers();
      },
      /* Page-break offsets that never cut through a line, in CSS pixels. */
      metrics: function (pageH) {
        var m = computeBreaks(pageH);
        return JSON.stringify(m);
      },
      showPageBreaks: renderPageBreaks,
      theme: function (dark) {
        document.documentElement.classList.toggle('dark', !!dark);
      }
    };

    /* Elements that are one visual unit and must never be split across a page:
       a display formula, a table, a code block. There is no safe place to cut
       inside one - a formula has no "line", a table row could straddle a page -
       so their own top and bottom edges are the only candidates. */
    var HARD_ATOMIC_SELECTOR = '.km.kd, table, pre';
    /* A boxed passage is kept whole the same way, but only when a whole page can
       actually hold it - it is ordinary paragraph text, so unlike a formula it
       does have safe internal lines, and falls back to those instead of forcing
       an oversized box onto one page or, worse, off the page. */
    var SOFT_ATOMIC_SELECTOR = '.boxed';
    /* Elements whose own wrapped lines are safe cut points. Earlier this only
       used each block's own bottom edge, so a paragraph or boxed passage taller
       than the gap left on a page had nowhere safe to break and got sliced
       through the middle of a line. Every wrapped line is now a candidate. */
    var LEAF_SELECTOR = 'p, li, blockquote, .boxed, .env, h1, h2, h3, h4, .docmeta, .abstract';
    var PAGE_HEIGHT = 864;

    /// Element rects as page-local, unscaled deltas. getBoundingClientRect()
    /// reports the visually zoomed-out position when fit() has scaled the page
    /// down, so every delta from the page's own top is divided back by the
    /// current zoom to recover the real, unscaled px that pageH is measured in -
    /// the same units the export uses, which never applies this cosmetic zoom.
    function rectsOf(selector, originY) {
      var out = [];
      var els = doc.querySelectorAll(selector);
      for (var i = 0; i < els.length; i++) {
        var r = els[i].getBoundingClientRect();
        if (r.height > 0) {
          out.push({ top: (r.top - originY) / currentScale, bottom: (r.bottom - originY) / currentScale });
        }
      }
      return out;
    }

    /// Every y (in page-local, unscaled px) it would be safe to cut at, plus the
    /// total height and width of the page content, also unscaled.
    function computeBreaks(pageH) {
      var pageRect = page.getBoundingClientRect();
      var originY = pageRect.top;
      var total = Math.ceil(pageRect.height / currentScale);
      var width = Math.ceil(pageRect.width / currentScale);

      var hardAtomics = rectsOf(HARD_ATOMIC_SELECTOR, originY);
      var softAtomics = rectsOf(SOFT_ATOMIC_SELECTOR, originY);

      var soft = [];
      var leafEls = doc.querySelectorAll(LEAF_SELECTOR);
      var range = document.createRange();
      for (var l = 0; l < leafEls.length; l++) {
        var el = leafEls[l];
        range.selectNodeContents(el);
        var rects = range.getClientRects();
        for (var i = 0; i < rects.length; i++) {
          if (rects[i].height > 0) soft.push(Math.round((rects[i].bottom - originY) / currentScale));
        }
        var own = el.getBoundingClientRect();
        if (own.height > 0) soft.push(Math.round((own.bottom - originY) / currentScale));
      }
      hardAtomics.concat(softAtomics).forEach(function (a) {
        soft.push(Math.round(a.top));
        soft.push(Math.round(a.bottom));
      });

      // never land inside a formula, a table or a code block
      soft = soft.filter(function (y) {
        for (var i = 0; i < hardAtomics.length; i++) {
          if (y > hardAtomics[i].top + 1 && y < hardAtomics[i].bottom - 1) return false;
        }
        return true;
      });
      // a boxed passage is kept whole too, but only where that is possible: once
      // it is taller than a full page there is no page it would ever fit on, so
      // it rolls over freely instead, breaking at its own safe line boundaries.
      soft = soft.filter(function (y) {
        for (var i = 0; i < softAtomics.length; i++) {
          var box = softAtomics[i];
          if (box.bottom - box.top > pageH) continue;
          if (y > box.top + 1 && y < box.bottom - 1) return false;
        }
        return true;
      });
      soft = Array.from(new Set(soft)).sort(function (x, y) { return x - y; });

      // A typed page break is mandatory, not just another candidate: the page
      // ends there even if there was room left, the way \newpage always does.
      // Everything between two mandatory breaks (or the start/end of the
      // document) is paginated on its own, so a break never crosses one.
      var mandatory = [];
      var breakEls = doc.querySelectorAll('.page-break-here');
      for (var m = 0; m < breakEls.length; m++) {
        var mr = breakEls[m].getBoundingClientRect();
        var my = Math.round((mr.top - originY) / currentScale);
        if (my > 0 && my < total) mandatory.push(my);
      }
      mandatory = Array.from(new Set(mandatory)).sort(function (x, y) { return x - y; });

      var breaks = [];
      var segmentStart = 0;
      var boundaries = mandatory.concat([total]);
      for (var s = 0; s < boundaries.length; s++) {
        var segmentEnd = boundaries[s];
        if (segmentEnd > segmentStart) {
          breaks = breaks.concat(pagesWithin(soft, segmentStart, segmentEnd, pageH));
        } else {
          breaks.push(segmentEnd); // two page breaks with nothing between them
        }
        segmentStart = segmentEnd;
      }
      if (!breaks.length) breaks.push(total);
      return { total: total, width: width, breaks: breaks };
    }

    /// Safe break points for the content between start and end, always ending
    /// exactly at end (a real page boundary, whether that is the end of the
    /// document or a mandatory break).
    function pagesWithin(soft, start, end, pageH) {
      var breaks = [];
      var guard = 0;
      while (start < end - 2 && guard < 2000) {
        guard++;
        var limit = Math.min(start + pageH, end);
        if (limit >= end) { breaks.push(end); break; }
        var best = -1;
        for (var i = 0; i < soft.length; i++) {
          if (soft[i] > start && soft[i] <= limit && soft[i] > best) best = soft[i];
        }
        if (best < 0) {
          // Nothing fits in a whole page: one line or block is taller than the
          // page. Take the next real edge rather than guess a pixel row, so the
          // page still runs long instead of cutting through content.
          for (var j = 0; j < soft.length; j++) {
            if (soft[j] > start && soft[j] < end) { best = soft[j]; break; }
          }
        }
        if (best <= start) { breaks.push(end); break; }
        breaks.push(best);
        start = best;
      }
      if (!breaks.length) breaks.push(end);
      return breaks;
    }

    function removeBreakMarkers() {
      var old = page.querySelectorAll('.page-break');
      for (var i = 0; i < old.length; i++) old[i].remove();
    }

    /// Draws where the PDF export will cut the page. computeBreaks() already
    /// returns unscaled, page-local px regardless of the current zoom, and the
    /// markers are children of .page, so they scale back with it visually - no
    /// need to touch the live transform to place them.
    function renderPageBreaks() {
      removeBreakMarkers();
      if (exporting) return;
      var m = computeBreaks(PAGE_HEIGHT);
      for (var i = 0; i < m.breaks.length - 1; i++) {
        var y = m.breaks[i];
        if (y >= m.total - 1) continue;
        var marker = document.createElement('div');
        marker.className = 'page-break';
        marker.style.top = y + 'px';
        var tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = 'Page ' + (i + 2);
        marker.appendChild(tag);
        page.appendChild(marker);
      }
    }

    // The math fonts swap in after this fires, which can change every formula's
    // size and reflow the page. fit() has to run again too, or the zoomed-out
    // stage keeps the height it reserved for the pre-font layout, leaving it
    // mismatched with the page's real size from here on.
    fontsReady.then(settleAndFit);
  })();
  </script>
</body>
</html>
